<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PhotoVault (Email Auth)</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
  <style>
    .gallery-item { transition: transform 0.2s; }
    .gallery-item:hover { transform: scale(1.03); }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <div class="container mx-auto p-4">
    <h1 class="text-2xl font-bold mb-4">📸 PhotoVault (Local Storage + Email Auth)</h1>

    <!-- Tabs -->
    <div class="mb-4 flex gap-4">
      <button id="tab-login" class="px-4 py-2 bg-gray-300 rounded">Login</button>
      <button id="tab-signup" class="px-4 py-2 bg-gray-200 rounded">Sign Up</button>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="mb-4">
      <input type="email" id="login-email" placeholder="Email" class="block mb-2 p-2 w-full border rounded" required />
      <input type="password" id="login-password" placeholder="Password" class="block mb-2 p-2 w-full border rounded" required />
      <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Login</button>
    </form>

    <!-- Signup Form -->
    <form id="signup-form" class="mb-4 hidden">
      <input type="email" id="signup-email" placeholder="Email" class="block mb-2 p-2 w-full border rounded" required />
      <input type="password" id="signup-password" placeholder="Password" class="block mb-2 p-2 w-full border rounded" required />
      <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded">Sign Up</button>
    </form>

    <!-- Logout -->
    <button id="logout-button" class="bg-red-500 text-white px-4 py-2 rounded hidden mb-4">Logout</button>

    <!-- Upload form -->
    <form id="upload-form" class="mb-4 hidden">
      <input type="file" id="media-upload" multiple accept="image/*" class="mb-2">
      <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded">Upload</button>
    </form>

    <!-- Image gallery -->
    <div id="gallery" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
  </div>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyABCENXW3VavR_ynfzolN3TChbakSltjRE",
      authDomain: "apollo-save.firebaseapp.com",
      projectId: "apollo-save",
      appId: "1:101571335083:web:ca4a6369ed370e7ec078ee"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    document.addEventListener("DOMContentLoaded", () => {
      const loginTab = document.getElementById("tab-login");
      const signupTab = document.getElementById("tab-signup");
      const loginForm = document.getElementById("login-form");
      const signupForm = document.getElementById("signup-form");
      const logoutBtn = document.getElementById("logout-button");
      const uploadForm = document.getElementById("upload-form");
      const mediaInput = document.getElementById("media-upload");
      const gallery = document.getElementById("gallery");

      // Tab Switching
      loginTab.addEventListener("click", () => {
        loginForm.classList.remove("hidden");
        signupForm.classList.add("hidden");
        loginTab.classList.add("bg-gray-300");
        signupTab.classList.remove("bg-gray-300");
      });

      signupTab.addEventListener("click", () => {
        signupForm.classList.remove("hidden");
        loginForm.classList.add("hidden");
        signupTab.classList.add("bg-gray-300");
        loginTab.classList.remove("bg-gray-300");
      });

      // Signup
      signupForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("signup-email").value;
        const password = document.getElementById("signup-password").value;

        auth.createUserWithEmailAndPassword(email, password)
          .then(() => alert("Signed up successfully!"))
          .catch(err => alert("Signup error: " + err.message));
      });

      // Login
      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("login-email").value;
        const password = document.getElementById("login-password").value;

        auth.signInWithEmailAndPassword(email, password)
          .catch(err => alert("Login error: " + err.message));
      });

      // Logout
      logoutBtn.addEventListener("click", () => {
        auth.signOut();
      });

      // Save image to localStorage
      function saveImageToLocalStorage(userId, file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const images = JSON.parse(localStorage.getItem(`user_${userId}_images`) || "[]");
          images.push({ url: e.target.result, name: file.name });
          localStorage.setItem(`user_${userId}_images`, JSON.stringify(images));
          loadUserImages(userId);
        };
        reader.readAsDataURL(file);
      }

      // Load gallery from localStorage
      function loadUserImages(userId) {
        gallery.innerHTML = "";
        const images = JSON.parse(localStorage.getItem(`user_${userId}_images`) || "[]");
        if (images.length === 0) {
          gallery.innerHTML = "<p class='text-gray-500'>No images uploaded yet.</p>";
          return;
        }

        images.forEach(img => {
          const imgElement = document.createElement("div");
          imgElement.className = "gallery-item bg-white p-4 rounded-lg shadow";
          imgElement.innerHTML = `
            <img src="${img.url}" class="w-full h-48 object-cover mb-2 rounded">
            <p class="text-sm truncate">${img.name}</p>
          `;
          gallery.appendChild(imgElement);
        });
      }

      // Upload handler
      uploadForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const user = auth.currentUser;
        if (!user) return alert("You must be logged in.");

        const files = mediaInput.files;
        if (!files.length) return alert("Select at least one image.");

        Array.from(files).forEach(file => {
          saveImageToLocalStorage(user.uid, file);
        });

        mediaInput.value = "";
      });

      // Auth state observer
      auth.onAuthStateChanged((user) => {
        if (user) {
          loginForm.classList.add("hidden");
          signupForm.classList.add("hidden");
          logoutBtn.classList.remove("hidden");
          uploadForm.classList.remove("hidden");
          loadUserImages(user.uid);
        } else {
          logoutBtn.classList.add("hidden");
          uploadForm.classList.add("hidden");
          gallery.innerHTML = "<p class='text-gray-600'>Please log in to view your photo vault.</p>";
        }
      });
    });
  </script>
</body>
</html>
