<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PhotoVault (Local Storage with Trash)</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
  <style>
    .gallery-item { transition: transform 0.2s; }
    .gallery-item:hover { transform: scale(1.03); }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <div class="container mx-auto p-4 max-w-3xl">
    <h1 class="text-3xl font-bold mb-6">📸 PhotoVault (Local Storage)</h1>

    <!-- Auth Tabs -->
    <div class="mb-6">
      <nav class="flex space-x-4">
        <button id="tab-login" class="py-2 px-4 border-b-2 border-blue-600 font-semibold">Login</button>
        <button id="tab-signup" class="py-2 px-4 border-b-2 border-transparent hover:border-blue-400">Sign Up</button>
      </nav>

      <!-- Login Form -->
      <form id="login-form" class="mt-4">
        <input id="login-email" type="email" placeholder="Email" required class="mb-2 w-full p-2 border rounded" />
        <input id="login-password" type="password" placeholder="Password" required class="mb-4 w-full p-2 border rounded" />
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Log In</button>
      </form>

      <!-- Signup Form -->
      <form id="signup-form" class="mt-4 hidden">
        <input id="signup-email" type="email" placeholder="Email" required class="mb-2 w-full p-2 border rounded" />
        <input id="signup-password" type="password" placeholder="Password" required class="mb-4 w-full p-2 border rounded" />
        <button type="submit" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">Sign Up</button>
      </form>
    </div>

    <!-- Authenticated UI -->
    <div id="app-ui" class="hidden">
      <div class="flex justify-between items-center mb-4">
        <div>
          <button id="gallery-view-btn" class="mr-2 px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">Gallery</button>
          <button id="trash-view-btn" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">Trash</button>
        </div>
        <button id="logout-button" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">Logout</button>
      </div>

      <!-- Upload form -->
      <form id="upload-form" class="mb-6">
        <input type="file" id="media-upload" multiple accept="image/*" class="mb-2" />
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Upload</button>
      </form>

      <!-- Image gallery / Trash container -->
      <div id="gallery" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
    </div>
  </div>

  <script>
    // Firebase config (replace with your own)
    const firebaseConfig = {
      apiKey: "AIzaSyABCENXW3VavR_ynfzolN3TChbakSltjRE",
      authDomain: "apollo-save.firebaseapp.com",
      projectId: "apollo-save",
      appId: "1:101571335083:web:ca4a6369ed370e7ec078ee"
    };

    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // DOM elements
    const tabLogin = document.getElementById("tab-login");
    const tabSignup = document.getElementById("tab-signup");
    const loginForm = document.getElementById("login-form");
    const signupForm = document.getElementById("signup-form");
    const appUI = document.getElementById("app-ui");
    const logoutBtn = document.getElementById("logout-button");
    const uploadForm = document.getElementById("upload-form");
    const mediaInput = document.getElementById("media-upload");
    const gallery = document.getElementById("gallery");
    const galleryViewBtn = document.getElementById("gallery-view-btn");
    const trashViewBtn = document.getElementById("trash-view-btn");

    let currentView = "gallery"; // or "trash"

    // Tab switching
    tabLogin.addEventListener("click", () => {
      tabLogin.classList.add("border-blue-600", "font-semibold");
      tabLogin.classList.remove("border-transparent");
      tabSignup.classList.remove("border-blue-600", "font-semibold");
      tabSignup.classList.add("border-transparent");
      loginForm.classList.remove("hidden");
      signupForm.classList.add("hidden");
    });

    tabSignup.addEventListener("click", () => {
      tabSignup.classList.add("border-blue-600", "font-semibold");
      tabSignup.classList.remove("border-transparent");
      tabLogin.classList.remove("border-blue-600", "font-semibold");
      tabLogin.classList.add("border-transparent");
      signupForm.classList.remove("hidden");
      loginForm.classList.add("hidden");
    });

    // Signup handler
    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("signup-email").value.trim();
      const password = document.getElementById("signup-password").value.trim();

      try {
        await auth.createUserWithEmailAndPassword(email, password);
        alert("Sign up successful! You are now logged in.");
      } catch (error) {
        alert("Error signing up: " + error.message);
      }
    });

    // Login handler
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value.trim();

      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (error) {
        alert("Error logging in: " + error.message);
      }
    });

    // Logout handler
    logoutBtn.addEventListener("click", () => {
      auth.signOut();
    });

    // Save image to localStorage
    function saveImageToLocalStorage(userId, file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const images = JSON.parse(localStorage.getItem(`user_${userId}_images`) || "[]");
        images.push({ url: e.target.result, name: file.name });
        localStorage.setItem(`user_${userId}_images`, JSON.stringify(images));
        if (currentView === "gallery") loadUserImages(userId);
      };
      reader.readAsDataURL(file);
    }

    // Load images from localStorage (gallery)
    function loadUserImages(userId) {
      gallery.innerHTML = "";
      const images = JSON.parse(localStorage.getItem(`user_${userId}_images`) || "[]");
      if (images.length === 0) {
        gallery.innerHTML = "<p class='text-gray-500'>No images uploaded yet.</p>";
        return;
      }

      images.forEach((img, index) => {
        const imgElement = document.createElement("div");
        imgElement.className = "gallery-item bg-white p-4 rounded-lg shadow";
        imgElement.innerHTML = `
          <img src="${img.url}" class="w-full h-48 object-cover mb-2 rounded" alt="${img.name}">
          <p class="text-sm truncate">${img.name}</p>
          <button class="mt-2 bg-yellow-500 text-white px-2 py-1 rounded text-sm w-full" onclick="moveToTrash('${userId}', ${index})">Move to Trash</button>
        `;
        gallery.appendChild(imgElement);
      });
    }

    // Load images from Trash
    function loadTrashImages(userId) {
      gallery.innerHTML = "";
      const trash = JSON.parse(localStorage.getItem(`user_${userId}_trash`) || "[]");
      if (trash.length === 0) {
        gallery.innerHTML = "<p class='text-gray-500'>Trash is empty.</p>";
        return;
      }

      trash.forEach((img, index) => {
        const imgElement = document.createElement("div");
        imgElement.className = "gallery-item bg-white p-4 rounded-lg shadow";
        imgElement.innerHTML = `
          <img src="${img.url}" class="w-full h-48 object-cover mb-2 rounded" alt="${img.name}">
          <p class="text-sm truncate">${img.name}</p>
          <div class="flex space-x-2">
            <button class="flex-1 bg-green-600 text-white px-2 py-1 rounded text-sm" onclick="restoreFromTrash('${userId}', ${index})">Restore</button>
            <button class="flex-1 bg-red-600 text-white px-2 py-1 rounded text-sm" onclick="deletePermanently('${userId}', ${index})">Delete Permanently</button>
          </div>
        `;
        gallery.appendChild(imgElement);
      });
    }

    // Move image to trash
    function moveToTrash(userId, index) {
      const images = JSON.parse(localStorage.getItem(`user_${userId}_images`) || "[]");
      if (index < 0 || index >= images.length) return;
      const trash = JSON.parse(localStorage.getItem(`user_${userId}_trash`) || "[]");

      // Remove from images and add to trash
      const [removed] = images.splice(index, 1);
      trash.push(removed);

      // Save both lists back
      localStorage.setItem(`user_${userId}_images`, JSON.stringify(images));
      localStorage.setItem(`user_${userId}_trash`, JSON.stringify(trash));

      // Refresh current view
      if (currentView === "gallery") loadUserImages(userId);
      else loadTrashImages(userId);
    }

    // Restore image from trash
    function restoreFromTrash(userId, index) {
      const trash = JSON.parse(localStorage.getItem(`user_${userId}_trash`) || "[]");
      if (index < 0 || index >= trash.length) return;
      const images = JSON.parse(localStorage.getItem(`user_${userId}_images`) || "[]");

      // Remove from trash and add to images
      const [restored] = trash.splice(index, 1);
      images.push(restored);

      // Save both lists back
      localStorage.setItem(`user_${userId}_trash`, JSON.stringify(trash));
      localStorage.setItem(`user_${userId}_images`, JSON.stringify(images));

      if (currentView === "trash") loadTrashImages(userId);
      else loadUserImages(userId);
    }

    // Permanently delete from trash
    function deletePermanently(userId, index) {
      const trash = JSON.parse(localStorage.getItem(`user_${userId}_trash`) || "[]");
      if (index < 0 || index >= trash.length) return;

      trash.splice(index, 1);
      localStorage.setItem(`user_${userId}_trash`, JSON.stringify(trash));

      if (currentView === "trash") loadTrashImages(userId);
      else loadUserImages(userId);
    }

    // Upload form handler
    uploadForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const user = auth.currentUser;
      if (!user) {
        alert("You must be logged in to upload images.");
        return;
      }

      const files = mediaInput.files;
      if (!files.length) {
        alert("Select at least one image.");
        return;
      }

      Array.from(files).forEach(file => {
        saveImageToLocalStorage(user.uid, file);
      });

      mediaInput.value = "";
    });

    // Switch to gallery view
    galleryViewBtn.addEventListener("click", () => {
      currentView = "gallery";
      const user = auth.currentUser;
      if (user) loadUserImages(user.uid);
    });

    // Switch to trash view
    trashViewBtn.addEventListener("click", () => {
      currentView = "trash";
      const user = auth.currentUser;
      if (user) loadTrashImages(user.uid);
    });

    // Listen for auth state changes
    auth.onAuthStateChanged((user) => {
      if (user) {
        appUI.classList.remove("hidden");
        loginForm.classList.add("hidden");
        signupForm.classList.add("hidden");
        tabLogin.classList.add("border-blue-600", "font-semibold");
        tabLogin.classList.remove("border-transparent");
        tabSignup.classList.remove("border-blue-600", "font-semibold");
        tabSignup.classList.add("border-transparent");

        // Show gallery by default on login
        currentView = "gallery";
        loadUserImages(user.uid);
      } else {
        appUI.classList.add("hidden");
        loginForm.classList.remove("hidden");
        signupForm.classList.add("hidden");
        gallery.innerHTML = "";
      }
    });

    // Make the trash/restore/delete functions accessible globally (for inline onclick)
    window.moveToTrash = moveToTrash;
    window.restoreFromTrash = restoreFromTrash;
    window.deletePermanently = deletePermanently;
  </script>

</body>
</html>
