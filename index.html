<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhotoVault (Email Auth + IndexedDB)</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
  <style>
    .gallery-item { transition: transform 0.2s; }
    .gallery-item:hover { transform: scale(1.03); }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="container mx-auto p-4">
    <h1 class="text-2xl font-bold mb-4">📸 PhotoVault (Email Auth + IndexedDB)</h1><!-- Tabs -->
<div class="mb-4 flex gap-4">
  <button id="tab-login" class="px-4 py-2 bg-gray-300 rounded">Login</button>
  <button id="tab-signup" class="px-4 py-2 bg-gray-200 rounded">Sign Up</button>
</div>

<!-- Login Form -->
<form id="login-form" class="mb-4">
  <input type="email" id="login-email" placeholder="Email" class="block mb-2 p-2 w-full border rounded" required />
  <input type="password" id="login-password" placeholder="Password" class="block mb-2 p-2 w-full border rounded" required />
  <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Login</button>
</form>

<!-- Signup Form -->
<form id="signup-form" class="mb-4 hidden">
  <input type="email" id="signup-email" placeholder="Email" class="block mb-2 p-2 w-full border rounded" required />
  <input type="password" id="signup-password" placeholder="Password" class="block mb-2 p-2 w-full border rounded" required />
  <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded">Sign Up</button>
</form>

<!-- Logout -->
<button id="logout-button" class="bg-red-500 text-white px-4 py-2 rounded hidden mb-4">Logout</button>

<!-- Upload form -->
<form id="upload-form" class="mb-4 hidden">
  <input type="file" id="media-upload" multiple accept="image/*,video/*" class="mb-2">
  <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded">Upload</button>
</form>

<!-- Image gallery -->
<div id="gallery" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>

  </div>  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyABCENXW3VavR_ynfzolN3TChbakSltjRE",
      authDomain: "apollo-save.firebaseapp.com",
      projectId: "apollo-save",
      appId: "1:101571335083:web:ca4a6369ed370e7ec078ee"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // IndexedDB setup
    let db;
    const request = indexedDB.open("PhotoVaultDB", 1);
    request.onerror = (e) => console.error("DB error", e);
    request.onsuccess = (e) => db = e.target.result;
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("media")) {
        db.createObjectStore("media", { keyPath: "id", autoIncrement: true });
      }
    };

    function saveToDB(userId, file) {
      const reader = new FileReader();
      reader.onload = () => {
        const tx = db.transaction("media", "readwrite");
        const store = tx.objectStore("media");
        store.add({ userId, name: file.name, data: reader.result });
        tx.oncomplete = () => loadUserMedia(userId);
      };
      reader.readAsDataURL(file);
    }

    function loadUserMedia(userId) {
      const gallery = document.getElementById("gallery");
      gallery.innerHTML = "";
      const tx = db.transaction("media", "readonly");
      const store = tx.objectStore("media");
      const request = store.openCursor();
      request.onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) {
          const { userId: uid, name, data } = cursor.value;
          if (uid === userId) {
            const el = document.createElement("div");
            el.className = "gallery-item bg-white p-4 rounded-lg shadow";
            el.innerHTML = data.includes("video") ?
              `<video controls class="w-full h-48 mb-2 rounded"><source src="${data}"></video><p class="text-sm truncate">${name}</p>` :
              `<img src="${data}" class="w-full h-48 object-cover mb-2 rounded"><p class="text-sm truncate">${name}</p>`;
            gallery.appendChild(el);
          }
          cursor.continue();
        }
      };
    }

    document.addEventListener("DOMContentLoaded", () => {
      const loginTab = document.getElementById("tab-login");
      const signupTab = document.getElementById("tab-signup");
      const loginForm = document.getElementById("login-form");
      const signupForm = document.getElementById("signup-form");
      const logoutBtn = document.getElementById("logout-button");
      const uploadForm = document.getElementById("upload-form");
      const mediaInput = document.getElementById("media-upload");

      loginTab.onclick = () => {
        loginForm.classList.remove("hidden");
        signupForm.classList.add("hidden");
      };
      signupTab.onclick = () => {
        signupForm.classList.remove("hidden");
        loginForm.classList.add("hidden");
      };

      signupForm.onsubmit = (e) => {
        e.preventDefault();
        const email = signupForm[0].value;
        const password = signupForm[1].value;
        auth.createUserWithEmailAndPassword(email, password)
          .then(() => alert("Signed up!"))
          .catch(err => alert("Signup error: " + err.message));
      };

      loginForm.onsubmit = (e) => {
        e.preventDefault();
        const email = loginForm[0].value;
        const password = loginForm[1].value;
        auth.signInWithEmailAndPassword(email, password)
          .catch(err => alert("Login error: " + err.message));
      };

      logoutBtn.onclick = () => auth.signOut();

      uploadForm.onsubmit = (e) => {
        e.preventDefault();
        const user = auth.currentUser;
        if (!user) return alert("Not logged in");
        Array.from(mediaInput.files).forEach(file => saveToDB(user.uid, file));
        mediaInput.value = "";
      };

      auth.onAuthStateChanged((user) => {
        if (user) {
          loginForm.classList.add("hidden");
          signupForm.classList.add("hidden");
          logoutBtn.classList.remove("hidden");
          uploadForm.classList.remove("hidden");
          loadUserMedia(user.uid);
        } else {
          logoutBtn.classList.add("hidden");
          uploadForm.classList.add("hidden");
          document.getElementById("gallery").innerHTML = "<p class='text-gray-600'>Please log in to view your media vault.</p>";
        }
      });
    });
  </script></body>
</html>
